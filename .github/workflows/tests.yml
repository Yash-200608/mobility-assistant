name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit tests (hardware-free)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Deliberately NOT requirements.txt: the suite stubs camera, serial, audio,
      # Twilio and LLM layers, so it needs no GPU, hardware, model download or API key.
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Verify model artifacts match models.lock.json
        run: python tools/verify_models.py

      - name: Simulator smoke test (fall -> automatic SOS, nothing sent)
        run: python tools/demo_sim.py fall_unanswered

  lint:
    name: lint (syntax and undefined names)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-test.txt coverage
      - name: Measure
        run: |
          coverage run -m unittest discover -s tests
          coverage report > coverage.txt
          { echo '### Coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.txt
