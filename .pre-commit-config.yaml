# Install once:  pip install pre-commit && pre-commit install
# Refresh pins:  pre-commit autoupdate
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--select", "E9,F63,F7,F82"]

  - repo: local
    hooks:
      - id: unit-tests
        name: unit tests
        entry: python -m unittest discover -s tests
        language: system
        pass_filenames: false
        stages: [pre-push]
